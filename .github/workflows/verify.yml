name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  decryptor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Python packages
        run: pip install pycryptodome
      - name: Reference decryptor self-tests
        working-directory: nativ/decrypt
        run: |
          python -m vitadecrypt.pkg --selftest
          python -m vitadecrypt.pfs --selftest
      - name: Android decryptor (synthetic PKG, failures, space)
        run: android/tests/run.sh
