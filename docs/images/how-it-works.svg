<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
  <title id="title">Tokyo Ghoul: JAIL Recompiled — local preparation and native platform builds</title>
  <desc id="desc">User-owned Vita files stay outside the public release. The shared PyQt6 launcher prepares them in a user library, then the generated game and shared runtime run on macOS or Windows, while Android has its own installer path. Linux is planned.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08070a"/><stop offset="1" stop-color="#16080d"/></linearGradient>
    <linearGradient id="red" x1="0" x2="1"><stop stop-color="#d21432"/><stop offset="1" stop-color="#7d000f"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#d21432"/></marker>
    <style>
      .k{font:700 12px Arial,sans-serif;letter-spacing:3px;fill:#c8102e}.h{font:700 40px Georgia,serif;fill:#f0eadf}.s{font:14px Arial,sans-serif;fill:#9b9084}.t{font:700 18px Arial,sans-serif;fill:#ece5d9}.b{font:13px Arial,sans-serif;fill:#a89d90}.n{font:12px Arial,sans-serif;fill:#6b625a}
    </style>
  </defs>
  <rect width="1200" height="1040" fill="url(#bg)"/><rect width="1200" height="4" fill="url(#red)"/>
  <text x="70" y="64" class="k">ARCHITECTURE</text><text x="70" y="115" class="h">How it works</text>
  <text x="70" y="147" class="s">One shared native game/runtime core. Local inputs, user library, platform hosts.</text>

  <text x="70" y="205" class="k">01 · YOUR LOCAL INPUTS</text>
  <rect x="70" y="225" width="1060" height="104" rx="4" fill="#0d0b0e" stroke="#392027"/>
  <text x="100" y="261" class="t">Release folder / data/</text>
  <text x="100" y="287" class="b">PCSG00615.pkg · work.bin · PSVUPDAT.PUP</text>
  <text x="100" y="310" class="n">your legally obtained files; not shipped in public releases and never uploaded</text>
  <path d="M600 333v48" stroke="#d21432" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="70" y="380" class="k">02 · SHARED PYQT6 LAUNCHER</text>
  <g><rect x="70" y="400" width="320" height="112" rx="4" fill="#0d0b0e" stroke="#392027"/>
    <text x="94" y="438" class="t">Validate</text><text x="94" y="464" class="b">content ID · licence · PUP</text><text x="94" y="488" class="n">checks the three local inputs</text>
    <rect x="440" y="400" width="320" height="112" rx="4" fill="#0d0b0e" stroke="#392027"/>
    <text x="464" y="438" class="t">PREPARE &amp; PLAY</text><text x="464" y="464" class="b">decrypt · import · analyse</text><text x="464" y="488" class="n">builds the native game locally</text>
    <rect x="810" y="400" width="320" height="112" rx="4" fill="#0d0b0e" stroke="#392027"/>
    <text x="834" y="438" class="t">User library</text><text x="834" y="464" class="b">builds · saves · settings · logs</text><text x="834" y="488" class="n">outside the downloaded release folder</text>
  </g>
  <path d="M600 516v48" stroke="#d21432" stroke-width="2" marker-end="url(#arrow)"/>

  <text x="70" y="563" class="k">03 · SHARED CORE</text>
  <rect x="70" y="583" width="1060" height="112" rx="4" fill="#0d0b0e" stroke="#b00018"/>
  <text x="100" y="624" class="h" font-size="26">Generated game C + Vita-compatible runtime</text>
  <text x="100" y="657" class="b">graphics · audio · input · files · saves · timing · system modules</text>
  <text x="100" y="680" class="n">same game/runtime layer is compiled for each supported native host</text>

  <path d="M600 699v48M600 747H220v48M600 747H600v48M600 747h380v48" fill="none" stroke="#d21432" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="70" y="788" class="k">04 · PLATFORM HOSTS</text>
  <g><rect x="70" y="808" width="300" height="112" rx="4" fill="url(#red)"/>
    <text x="220" y="846" fill="#fff" font-family="Georgia,serif" font-size="22" text-anchor="middle" font-weight="700">macOS</text><text x="220" y="872" fill="#ffd9de" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">PyQt6 · SDL3 / Metal · arm64</text><text x="220" y="894" fill="#ffd9de" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">Tokyo Ghoul JAIL.app</text>
    <rect x="450" y="808" width="300" height="112" rx="4" fill="url(#red)"/>
    <text x="600" y="846" fill="#fff" font-family="Georgia,serif" font-size="22" text-anchor="middle" font-weight="700">Windows</text><text x="600" y="872" fill="#ffd9de" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">PyQt6 · SDL3 / D3D12/Vulkan · x86-64</text><text x="600" y="894" fill="#ffd9de" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">Tokyo Ghoul JAIL.exe</text>
    <rect x="830" y="808" width="300" height="112" rx="4" fill="url(#red)"/>
    <text x="980" y="846" fill="#fff" font-family="Georgia,serif" font-size="22" text-anchor="middle" font-weight="700">Android</text><text x="980" y="872" fill="#ffd9de" font-family="Arial,sans-serif" font-size="12" text-anchor="middle">Activity · SDL3 / Vulkan · arm64</text><text x="980" y="894" fill="#ffd9de" font-family="Arial,sans-serif" font-size="11" text-anchor="middle">APK first-launch installer</text>
  </g>
  <text x="70" y="980" class="n">Linux x86-64: planned · no Linux package in the current release</text>
</svg>
